name: Whitebox quality gate
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run verify:security-contracts
      - run: python3 -m unittest discover -s hermes/plugins/whitebox-agency -p 'test_*.py' -v
      - run: npm run eval
      - run: npm run build
      - run: npm run secret-scan
